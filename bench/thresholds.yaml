  limitations:
  - Synthetic local-only provider, not real AI APIs.
  - Provider explicitly honors idempotency keys; no proof of exactly-once behavior for real APIs.
  - Seeded decisions do not remove host scheduling variation; S1 token-bucket outcomes depend on arrival timing,
    not a common exact 429 trace.
  - Single pilot pairs are not significance tests; three official rounds also give limited precision.
  - Pilot S1 did not exercise C2 Retry-After handling.
  - C3 reduced S2 attempts but also successful requests in the exploratory pilot.
  - Three S0 pilot replications used different seeds and cannot isolate pure environmental noise.
  - No pilot efficacy observation is an official result.
clients:
  C0:
    max_attempts: 4
    attempt_timeout_seconds: 5.0
    logical_deadline_seconds: null
    fixed_retry_delay_seconds: 0.5
    full_jitter: false
    honor_retry_after: false
    circuit_breaker: false
    idempotency: false
  C1:
    max_attempts: 4
    attempt_timeout_seconds: 2.0
    logical_deadline_seconds: 6.0
    fixed_retry_delay_seconds: 0.5
    full_jitter: false
    honor_retry_after: false
    circuit_breaker: false
    idempotency: false
  C2:
    max_attempts: 4
    attempt_timeout_seconds: 2.0
    logical_deadline_seconds: 6.0
    fixed_retry_delay_seconds: null
    full_jitter: true
    honor_retry_after: true
    circuit_breaker: false
    idempotency: false
  C3:
