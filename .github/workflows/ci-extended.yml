name: Supplemental offline provider and client tests

'on': pull_request

permissions:
  contents: read

jobs:
  provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.4'
      - run: 'python -m pip install --only-binary=:all: -r requirements-dev.lock'
      - run: python -m pip check
      - run: python -m pytest -q --basetemp="$RUNNER_TEMP/pytest-provider" tests/
      - name: Check prohibited calls
        run: |
          for directory in src tests bench scripts; do
            if [ -d "$directory" ]; then
              status=0
              grep -REn --include='*.py' --include='*.sh' '\b(eval|exec|pickle|marshal)\b|os\.system\s*\(|shell\s*=\s*True|yaml\.load\s*\(' "$directory" || status=$?
              test "$status" -eq 1
            fi
          done
